services:
  filesystem-server:
    build:
      context: ./servers/filesystem
    ports:
      - 8081:8000
  memory-server:
    build:
      context: ./servers/memory
    ports:
      - 8082:8000
    volumes:
      - memory:/app/data:rw
  time-server:
    build:
      context: ./servers/time
    ports:
      - 8083:8000
  bilig-workpaper-server:
    build:
      context: ./servers/bilig-workpaper
    ports:
      - 8084:8000
    environment:
      BILIG_BASE_URL: ${BILIG_BASE_URL:-https://bilig.proompteng.ai}

volumes:
  memory:
